<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub Belgrano - MVC & Responsive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<!-- Se ajusta el padding: inferior en móvil (pb-24), superior en PC (md:pt-24) -->
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24 md:pb-8 md:pt-24 select-none">
    
    <!-- NAVEGACIÓN: Inferior en móvil, Superior y expandida en PC -->
    <nav class="fixed bottom-0 md:top-0 md:bottom-auto left-0 right-0 bg-white border-t md:border-t-0 md:border-b border-slate-200 shadow-xl md:shadow-sm px-6 py-2 md:py-4 flex justify-around md:justify-center md:gap-12 w-full z-50">
        <button data-target="pantalla-home" class="nav-btn text-blue-600 flex flex-col md:flex-row items-center font-medium text-xs md:text-sm space-y-0.5 md:space-y-0 md:space-x-2 transition-all">
            <span class="material-symbols-outlined text-2xl font-light">home</span><span>Inicio</span>
        </button>
        <button data-target="pantalla-apuntes" class="nav-btn text-slate-400 flex flex-col md:flex-row items-center font-medium text-xs md:text-sm space-y-0.5 md:space-y-0 md:space-x-2 transition-all">
            <span class="material-symbols-outlined text-2xl font-light">menu_book</span><span>Apuntes</span>
        </button>
        <button data-target="pantalla-calendario" class="nav-btn text-slate-400 flex flex-col md:flex-row items-center font-medium text-xs md:text-sm space-y-0.5 md:space-y-0 md:space-x-2 transition-all">
            <span class="material-symbols-outlined text-2xl font-light">calendar_month</span><span>Calendario</span>
        </button>
    </nav>

    <!-- PANTALLA HOME: Se expande el contenedor principal -->
    <section id="pantalla-home" class="p-4 max-w-md md:max-w-4xl lg:max-w-5xl mx-auto space-y-6 md:space-y-8">
        <header class="flex items-center justify-between pt-4 md:pt-0">
            <div>
                <span class="text-xs md:text-sm font-semibold text-blue-600 uppercase tracking-wider">¡Hola, desarrollador!</span>
                <h1 class="text-2xl md:text-4xl font-bold text-slate-900">StudyHub Belgrano</h1>
            </div>
            <span class="material-symbols-outlined text-slate-700 text-3xl md:text-5xl">account_circle</span>
        </header>
        <article class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 space-y-3">
            <div class="flex items-center gap-2 text-red-600">
                <span class="material-symbols-outlined text-xl md:text-2xl">notification_important</span>
                <h2 class="font-semibold text-sm md:text-base uppercase tracking-wide">Alertas importantes</h2>
            </div>
            <div class="space-y-2">
                <div class="p-3 md:p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg">
                    <p class="text-xs md:text-sm text-red-500 font-medium">Próximo Martes 16/06</p>
                    <p class="text-sm md:text-lg font-semibold text-slate-800">Parcial 1: Arq. y Diseño de Interfaces</p>
                </div>
            </div>
        </article>
        <main class="grid grid-cols-2 gap-4 md:gap-8">
            <div data-target="pantalla-apuntes" class="nav-trigger bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between h-28 md:h-36 cursor-pointer hover:border-blue-300">
                <span class="material-symbols-outlined text-blue-600 text-2xl md:text-4xl">menu_book</span>
                <div>
                    <p class="text-2xl md:text-3xl font-bold text-slate-900" id="contador-apuntes">0</p>
                    <p class="text-xs md:text-sm text-slate-500 font-medium">Apuntes</p>
                </div>
            </div>
            <div data-target="pantalla-calendario" class="nav-trigger bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between h-28 md:h-36 cursor-pointer hover:border-blue-300">
                <span class="material-symbols-outlined text-emerald-600 text-2xl md:text-4xl">event_upcoming</span>
                <div>
                    <p class="text-2xl md:text-3xl font-bold text-slate-900">3</p>
                    <p class="text-xs md:text-sm text-slate-500 font-medium">Agenda</p>
                </div>
            </div>
        </main>
    </section>

    <!-- PANTALLA APUNTES -->
    <section id="pantalla-apuntes" class="p-4 max-w-md md:max-w-4xl lg:max-w-6xl mx-auto space-y-5 hidden">
        <header class="pt-4 md:pt-0">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Repositorio</h1>
        </header>
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar snap-x md:flex-wrap" id="contenedor-filtros">
            <!-- Filtros JS -->
        </div>
        <!-- Se convierte en grilla de varias columnas en PC -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4" id="contenedor-apuntes">
            <!-- Tarjetas JS -->
        </div>
    </section>

    <!-- PANTALLA CALENDARIO -->
    <section id="pantalla-calendario" class="p-4 max-w-md md:max-w-3xl mx-auto space-y-4 hidden">
        <header class="pt-4 md:pt-0">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Calendario</h1>
        </header>
        <!-- Grilla de eventos en PC -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="contenedor-calendario">
            <!-- Eventos JS -->
        </div>
    </section>

    <script src="js/modelo.js"></script>
    <script src="js/vista.js"></script>
    <script src="js/controlador.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
