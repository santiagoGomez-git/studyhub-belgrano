<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub Belgrano - MVC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24 select-none">
    
    <!-- PANTALLA HOME -->
    <section id="pantalla-home" class="p-4 max-w-md mx-auto space-y-6">
        <header class="flex items-center justify-between pt-4">
            <div>
                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">¡Hola, desarrollador!</span>
                <h1 class="text-2xl font-bold text-slate-900">StudyHub Belgrano</h1>
            </div>
            <span class="material-symbols-outlined text-slate-700 text-3xl">account_circle</span>
        </header>
        <main class="grid grid-cols-2 gap-4">
            <div data-target="pantalla-apuntes" class="nav-trigger bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between h-28 cursor-pointer hover:border-blue-300">
                <span class="material-symbols-outlined text-blue-600 text-2xl">menu_book</span>
                <div>
                    <p class="text-2xl font-bold text-slate-900" id="contador-apuntes">0</p>
                    <p class="text-xs text-slate-500 font-medium">Apuntes</p>
                </div>
            </div>
            <div data-target="pantalla-calendario" class="nav-trigger bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between h-28 cursor-pointer hover:border-blue-300">
                <span class="material-symbols-outlined text-emerald-600 text-2xl">event_upcoming</span>
                <div>
                    <p class="text-2xl font-bold text-slate-900">3</p>
                    <p class="text-xs text-slate-500 font-medium">Agenda</p>
                </div>
            </div>
        </main>
    </section>

    <!-- PANTALLA APUNTES -->
    <section id="pantalla-apuntes" class="p-4 max-w-md mx-auto space-y-5 hidden">
        <header class="pt-4">
            <h1 class="text-2xl font-bold text-slate-900">Repositorio</h1>
        </header>
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar snap-x" id="contenedor-filtros">
            <!-- Los filtros se renderizan desde JS -->
        </div>
        <div class="space-y-3" id="contenedor-apuntes">
            <!-- Las tarjetas se inyectan acá -->
        </div>
    </section>

    <!-- PANTALLA CALENDARIO -->
    <section id="pantalla-calendario" class="p-4 max-w-md mx-auto space-y-4 hidden">
        <header class="pt-4">
            <h1 class="text-2xl font-bold text-slate-900">Calendario</h1>
        </header>
        <div class="space-y-4" id="contenedor-calendario">
            <!-- Los eventos se inyectan acá -->
        </div>
    </section>

    <!-- NAVEGACIÓN -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-xl px-6 py-2 flex justify-around max-w-md mx-auto z-50">
        <button data-target="pantalla-home" class="nav-btn text-blue-600 flex flex-col items-center font-medium text-xs space-y-0.5 flex-1">
            <span class="material-symbols-outlined text-2xl font-light">home</span><span>Inicio</span>
        </button>
        <button data-target="pantalla-apuntes" class="nav-btn text-slate-400 flex flex-col items-center font-medium text-xs space-y-0.5 flex-1">
            <span class="material-symbols-outlined text-2xl font-light">menu_book</span><span>Apuntes</span>
        </button>
        <button data-target="pantalla-calendario" class="nav-btn text-slate-400 flex flex-col items-center font-medium text-xs space-y-0.5 flex-1">
            <span class="material-symbols-outlined text-2xl font-light">calendar_month</span><span>Calendario</span>
        </button>
    </nav>

    <!-- Scripts de la arquitectura MVC -->
    <script src="js/modelo.js"></script>
    <script src="js/vista.js"></script>
    <script src="js/controlador.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
